<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1eb">
  <meta name="description" content="A clean starting surface for a new web project.">
  <title>Hello World!</title>
  <style>
    :root {
      --paper: #f4f1eb;
      --ink: #11110f;
      --soft-ink: rgba(17, 17, 15, .46);
      --line: rgba(17, 17, 15, .22);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .28;
      background:
        radial-gradient(circle at 16% 22%, rgba(255,255,255,.9), transparent 26%),
        radial-gradient(circle at 76% 70%, rgba(166,151,128,.14), transparent 34%);
      mix-blend-mode: multiply;
    }

    .system-note {
      position: fixed;
      top: 24px;
      left: 26px;
      z-index: 3;
      margin: 0;
      color: var(--soft-ink);
      font: 10px/1.25 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .archive-link {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: rgba(244, 241, 235, .76);
      color: var(--ink);
      font: 10px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: .13em;
      text-decoration: none;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      transition: background .22s ease, color .22s ease, transform .22s ease, box-shadow .22s ease;
    }

    .archive-link::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 5px rgba(17,17,15,.08);
      animation: breathe 2.6s ease-in-out infinite;
    }

    .archive-link:hover,
    .archive-link:focus-visible {
      background: var(--ink);
      color: var(--paper);
      transform: translate(-3px, 3px);
      box-shadow: 8px -8px 0 rgba(17,17,15,.09);
      outline: none;
    }

    main {
      position: relative;
      z-index: 2;
      display: flex;
      min-height: 100svh;
      align-items: flex-end;
      padding: clamp(26px, 5vw, 72px);
    }

    .hero {
      max-width: 78vw;
      padding-bottom: clamp(22px, 5vh, 68px);
    }

    .hero h1 {
      margin: 0;
      max-width: 8ch;
      font-size: clamp(76px, 15vw, 230px);
      font-weight: 500;
      letter-spacing: -.085em;
      line-height: .78;
      text-wrap: balance;
    }

    .hero p {
      max-width: 430px;
      margin: clamp(25px, 4vw, 46px) 0 0 5px;
      color: var(--soft-ink);
      font-size: clamp(12px, 1.2vw, 16px);
      line-height: 1.55;
      letter-spacing: .02em;
    }

    .hero p span {
      color: var(--ink);
    }

    #guide {
      position: fixed;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .corner-index {
      position: fixed;
      right: 24px;
      bottom: 22px;
      z-index: 2;
      color: var(--soft-ink);
      font: 9px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(.75); opacity: .45; }
      50% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 700px) {
      .system-note { top: 20px; left: 18px; max-width: 42vw; }
      .archive-link { top: 14px; right: 14px; min-height: 38px; padding: 0 12px; }
      main { padding: 22px 18px; }
      .hero { max-width: 94vw; padding-bottom: 80px; }
      .hero h1 { font-size: clamp(72px, 23vw, 122px); line-height: .82; }
      .hero p { max-width: 74vw; margin-top: 28px; }
      .corner-index { right: 16px; bottom: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .archive-link::before { animation: none; }
      .archive-link { transition: none; }
    }
  </style>
</head>
<body>
  <p class="system-note">Classroom surface / 001</p>

  <a class="archive-link" id="archiveLink" href="garden.html" aria-label="Open The Garden archive">
    Enter archive <span aria-hidden="true">↗</span>
  </a>

  <main>
    <section class="hero" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Hello World!</h1>
      <p><span>This is the real page.</span> Start building here. The strange, living thing we made earlier is safely preserved in the archive.</p>
    </section>
  </main>

  <canvas id="guide" aria-hidden="true"></canvas>
  <div class="corner-index">Move / disturb the line</div>

  <script>
    (() => {
      const canvas = document.getElementById('guide');
      const context = canvas.getContext('2d');
      const title = document.getElementById('pageTitle');
      const link = document.getElementById('archiveLink');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const pointer = { x: innerWidth * .64, y: innerHeight * .42, tx: innerWidth * .64, ty: innerHeight * .42, active: false };
      let width = innerWidth;
      let height = innerHeight;
      let pixelRatio = Math.min(devicePixelRatio || 1, 2);
      let pulse = 0;

      const resize = () => {
        width = innerWidth;
        height = innerHeight;
        pixelRatio = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      };

      const pointOnCurve = (start, controlA, controlB, end, t) => {
        const mt = 1 - t;
        return {
          x: mt ** 3 * start.x + 3 * mt ** 2 * t * controlA.x + 3 * mt * t ** 2 * controlB.x + t ** 3 * end.x,
          y: mt ** 3 * start.y + 3 * mt ** 2 * t * controlA.y + 3 * mt * t ** 2 * controlB.y + t ** 3 * end.y
        };
      };

      const draw = (time = 0) => {
        pointer.x += (pointer.tx - pointer.x) * .075;
        pointer.y += (pointer.ty - pointer.y) * .075;
        pulse *= .92;

        const titleBox = title.getBoundingClientRect();
        const linkBox = link.getBoundingClientRect();
        const start = {
          x: Math.min(titleBox.right - titleBox.width * .08, width * .48),
          y: titleBox.top + titleBox.height * .18
        };
        const end = { x: linkBox.left - 12, y: linkBox.top + linkBox.height * .55 };
        const controlA = { x: start.x + (end.x - start.x) * .28, y: start.y - height * .15 };
        const controlB = { x: end.x - width * .22, y: end.y + height * .36 };
        const points = [];
        const count = Math.max(48, Math.round(width / 18));

        for (let index = 0; index <= count; index += 1) {
          const t = index / count;
          const base = pointOnCurve(start, controlA, controlB, end, t);
          const ahead = pointOnCurve(start, controlA, controlB, end, Math.min(1, t + .012));
          const dx = ahead.x - base.x;
          const dy = ahead.y - base.y;
          const length = Math.hypot(dx, dy) || 1;
          const envelope = Math.sin(Math.PI * t);
          const wave = Math.sin(t * 24 - time * .0042) * (6 + pulse * 12) * envelope;
          const distance = Math.hypot(base.x - pointer.x, base.y - pointer.y);
          const disturbance = pointer.active ? Math.max(0, 1 - distance / 170) * 34 * envelope : 0;
          points.push({
            x: base.x + (-dy / length) * (wave + disturbance),
            y: base.y + (dx / length) * (wave + disturbance)
          });
        }

        context.clearRect(0, 0, width, height);
        context.beginPath();
        context.moveTo(points[0].x, points[0].y);
        for (let index = 1; index < points.length - 1; index += 1) {
          const midpointX = (points[index].x + points[index + 1].x) / 2;
          const midpointY = (points[index].y + points[index + 1].y) / 2;
          context.quadraticCurveTo(points[index].x, points[index].y, midpointX, midpointY);
        }
        context.lineTo(end.x, end.y);
        context.strokeStyle = 'rgba(17,17,15,.72)';
        context.lineWidth = 1.45;
        context.lineCap = 'round';
        context.stroke();

        const beforeEnd = points[points.length - 3];
        const angle = Math.atan2(end.y - beforeEnd.y, end.x - beforeEnd.x);
        const headSize = 10 + pulse * 3;
        context.beginPath();
        context.moveTo(end.x, end.y);
        context.lineTo(end.x - Math.cos(angle - .62) * headSize, end.y - Math.sin(angle - .62) * headSize);
        context.moveTo(end.x, end.y);
        context.lineTo(end.x - Math.cos(angle + .62) * headSize, end.y - Math.sin(angle + .62) * headSize);
        context.strokeStyle = 'rgba(17,17,15,.88)';
        context.lineWidth = 1.7;
        context.stroke();

        if (!reducedMotion) requestAnimationFrame(draw);
      };

      addEventListener('resize', resize);
      addEventListener('pointermove', event => {
        pointer.tx = event.clientX;
        pointer.ty = event.clientY;
        pointer.active = true;
      }, { passive: true });
      addEventListener('pointerleave', () => { pointer.active = false; });
      addEventListener('pointerdown', () => { pulse = 1; }, { passive: true });

      resize();
      draw();
    })();
  </script>
</body>
</html>
