<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">Runbook concept map</title><desc id="desc">An event workspace connects six operational areas: lineup, crew, vendors, budget, files and briefing.</desc><defs><radialGradient id="g"><stop stop-color="#35332a"/><stop offset="1" stop-color="#101311"/></radialGradient></defs><rect width="1000" height="760" fill="url(#g)"/><g stroke="#81795f" stroke-width="1.5" opacity=".8"><path d="M500 380 190 155M500 380 500 155M500 380 810 155M500 380 190 605M500 380 500 605M500 380 810 605"/></g><g fill="#171a18" stroke="#8c846b" stroke-width="1.5"><rect x="365" y="295" width="270" height="170" rx="14" stroke="#f0c97e"/><rect x="75" y="110" width="230" height="90" rx="8"/><rect x="385" y="110" width="230" height="90" rx="8"/><rect x="695" y="110" width="230" height="90" rx="8"/><rect x="75" y="560" width="230" height="90" rx="8"/><rect x="385" y="560" width="230" height="90" rx="8"/><rect x="695" y="560" width="230" height="90" rx="8"/></g><g fill="#c0b9a6" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><text x="190" y="164">Lineup + set times</text><text x="500" y="164">Crew + shifts</text><text x="810" y="164">Vendors</text><text x="190" y="614">Budget</text><text x="500" y="614">Files + notes</text><text x="810" y="614">Shared briefing</text></g><text x="500" y="368" fill="#f0c97e" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" letter-spacing="3">ONE EVENT</text><text x="500" y="414" fill="#f5f0e5" font-family="Arial,sans-serif" font-size="37" text-anchor="middle" font-weight="600">RUNBOOK</text><text x="38" y="731" fill="#b4aa94" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">PRODUCT CONCEPT / NOT A SCREENSHOT</text></svg>